syntax = "proto3";

// Crypto operations.
enum CryptoOperation
{
    CRYPTO_OPERATION_UNSPECIFIED = 0;
    CRYPTO_OPERATION_LOAD_KEY = 1;
    CRYPTO_OPERATION_KEY_EXISTS = 2;
    CRYPTO_OPERATION_FLUSH_KEYS = 3;
    CRYPTO_OPERATION_SIGN = 4;
    CRYPTO_OPERATION_VERIFY = 5;
    CRYPTO_OPERATION_GENERATE_KEY_PAIR = 6;
    CRYPTO_OPERATION_DERIVE_SESSION_KEYS = 7;
    CRYPTO_OPERATION_GET_KEY_INFO = 8;
    CRYPTO_OPERATION_GENERATE_KEY = 9;
    CRYPTO_OPERATION_UNLOAD_KEY = 10;
    CRYPTO_OPERATION_IMPORT_KEY = 11;
    CRYPTO_OPERATION_EXPORT_KEY = 12;
    CRYPTO_OPERATION_GENERATE_RANDOM = 13;
    CRYPTO_OPERATION_ENCRYPT = 14;
    CRYPTO_OPERATION_DECRYPT = 15;
    CRYPTO_OPERATION_ALLOCATE_SHARED_BUFFER = 16;
    CRYPTO_OPERATION_RELEASE_SHARED_BUFFER = 17;
}

enum ProvisionType
{
    PROVISION_TYPE_UNSPECIFIED = 0;
    PROVISION_TYPE_PRE_PROVISIONED_GLOBAL = 1;
}

enum SignatureAlgorithm
{
    SIGN_ALGORITHM_UNSPECIFIED = 0;
    SIGN_ALGORITHM_HMAC = 1;
}

enum DigestAlgorithm
{
    DIGEST_ALGORITHM_UNSPECIFIED = 0;
    DIGEST_ALGORITHM_SHA256 = 1;
}

enum KeyPairAlgorithm
{
    KEY_PAIR_ALGORITHM_UNSPECIFIED = 0;
    KEY_PAIR_ALGORITHM_AUTH_DH = 1;
}

enum KeyType
{
    KEY_TYPE_UNSPECIFIED = 0;
    KEY_TYPE_PUBLIC = 1;
    KEY_TYPE_PRIVATE = 2;
    KEY_TYPE_SYMMETRIC = 3;
}

enum KeyUsage
{
    KEY_USAGE_UNSPECIFIED = 0;
    KEY_USAGE_ENCRYPT = 1;
    KEY_USAGE_DECRYPT = 2;
    KEY_USAGE_SIGN = 3;
    KEY_USAGE_VERIFY = 4;
    KEY_USAGE_DERIVE = 5;
    KEY_USAGE_WRAP = 6;
    KEY_USAGE_UNWRAP = 7;
}

enum KeyAlgorithm
{
    KEY_ALGORITHM_UNSPECIFIED = 0;
    KEY_ALGORITHM_AES_CBC = 1;
    KEY_ALGORITHM_AES_CTR = 2;
    KEY_ALGORITHM_SHA256 = 3;
    KEY_ALGORITHM_SHA384 = 4;
    KEY_ALGORITHM_SHA512 = 5;
    KEY_ALGORITHM_NFLXDH = 6;
    KEY_ALGORITHM_DH = 7;
}

enum GenerateKeyAlgorithm
{
    GENERATE_KEY_ALGORITHM_UNSPECIFIED = 0;
    GENERATE_KEY_ALGORITHM_AES128 = 1;
    GENERATE_KEY_ALGORITHM_AES256 = 2;
    GENERATE_KEY_ALGORITHM_HMAC128 = 3;
    GENERATE_KEY_ALGORITHM_HMAC160 = 4;
    GENERATE_KEY_ALGORITHM_HMAC256 = 5;
}

enum ImportExportType
{
    IMPORT_EXPORT_TYPE_UNSPECIFIED = 0;
    IMPORT_EXPORT_TYPE_PROTECTED = 1;
    IMPORT_EXPORT_TYPE_CLEAR = 2;
}

enum CipherAlgorithm
{
    CIPHER_ALGORITHM_UNSPECIFIED = 0;
    CIPHER_ALGORITHM_AES_CBC = 1;
}

enum CryptoError
{
    CRYPTO_ERROR_NONE = 0;
    CRYPTO_ERROR_AUTHENTICATION_FAILED = 1;
    CRYPTO_ERROR_INVALID_PARAMETERS = 2;
    CRYPTO_ERROR_OPERATION_FAILED = 3;
    CRYPTO_ERROR_LOCATOR_NOT_AVAILABLE = 4;
    CRYPTO_ERROR_INVALID_KEY_NAME = 5;
    CRYPTO_ERROR_INVALID_KEY_TYPE = 6;
    CRYPTO_ERROR_INVALID_KEY_ID = 7;
    CRYPTO_ERROR_INVALID_SESSION_STATE = 8;
    CRYPTO_ERROR_INVALID_INIT_DATA = 9;
    CRYPTO_ERROR_OVERSIZED_INPUT_DATA = 10;
    CRYPTO_ERROR_BUFFER_OVERFLOW = 11;
    CRYPTO_ERROR_KEY_PROVISION_ERROR = 12;
    CRYPTO_ERROR_SEALED_KEY_EXPORT_ERROR = 13;
}

message CryptoRequest
{
    CryptoOperation operation = 1;

    oneof payload
    {
        LoadKeyRequest load_key = 2;
        KeyExistsRequest key_exists = 3;
        FlushKeysRequest flush_keys = 4;
        SignRequest sign = 5;
        VerifyRequest verify = 6;
        GenerateKeyPairRequest generate_key_pair = 7;
        DeriveSessionKeysRequest derive_session_keys = 8;
        GetKeyInfoRequest get_key_info = 9;
        GenerateKeyRequest generate_key = 10;
        UnloadKeyRequest unload_key = 11;
        ImportKeyRequest import_key = 12;
        ExportKeyRequest export_key = 13;
        GenerateRandomRequest generate_random = 14;
        EncryptRequest encrypt = 15;
        DecryptRequest decrypt = 16;
        AllocateSharedBufferRequest allocate_shared_buffer = 17;
        ReleaseSharedBufferRequest release_shared_buffer = 18;
    }
}

message CryptoResponse
{
    CryptoError error = 1;

    oneof payload
    {
        LoadKeyResponse load_key = 2;
        KeyExistsResponse key_exists = 3;
        FlushKeysResponse flush_keys = 4;
        SignResponse sign = 5;
        VerifyResponse verify = 6;
        GenerateKeyPairResponse generate_key_pair = 7;
        DeriveSessionKeysResponse derive_session_keys = 8;
        GetKeyInfoResponse get_key_info = 9;
        GenerateKeyResponse generate_key = 10;
        UnloadKeyResponse unload_key = 11;
        ImportKeyResponse import_key = 12;
        ExportKeyResponse export_key = 13;
        GenerateRandomResponse generate_random = 14;
        EncryptResponse encrypt = 15;
        DecryptResponse decrypt = 16;
        AllocateSharedBufferResponse allocate_shared_buffer = 17;
        ReleaseSharedBufferResponse release_shared_buffer = 18;
    }
}

message BufferRegion
{
    uint32 offset = 1;
    uint32 length = 2;
}

message AllocateSharedBufferRequest { uint32 requested_size = 1; }

message AllocateSharedBufferResponse
{
    string buffer_id = 1;
    // POSIX shared-memory name used by the client with shm_open().
    string name = 2;
    uint32 size = 3;
}

message ReleaseSharedBufferRequest { string buffer_id = 1; }

message ReleaseSharedBufferResponse { }

message LoadKeyRequest
{
    // Locator for a pre-provisioned key.
    string locator = 1;
    ProvisionType provision_type = 2;
}

message LoadKeyResponse
{
    // Reference to the loaded key.
    uint32 key_id = 1;
}

message KeyExistsRequest { string locator = 1; }

message KeyExistsResponse
{
    bool exists = 1;
    // Reference to the existing key when exists is true.
    uint32 key_id = 2;
}

message FlushKeysRequest { }

message FlushKeysResponse { }

message SignRequest
{
    string buffer_id = 1;
    SignatureAlgorithm algorithm = 2;
    // Reference to a key loaded by load_key.
    uint32 key_id = 3;
    DigestAlgorithm digest_algorithm = 4;
    BufferRegion input_data = 5;
}

message SignResponse { BufferRegion signature = 1; }

message VerifyRequest
{
    string buffer_id = 1;
    SignatureAlgorithm algorithm = 2;
    // Reference to a key loaded by load_key.
    uint32 key_id = 3;
    DigestAlgorithm digest_algorithm = 4;
    BufferRegion input_data = 5;
    BufferRegion expected_signature = 6;
}

message VerifyResponse { bool verification_status = 1; }

message GenerateKeyPairRequest
{
    message AuthDhParameters
    {
        // AUTH_DH prime modulus, typically 256-521 bytes.
        bytes prime_p = 1;
        uint32 generator_g = 2;
    }

    KeyPairAlgorithm algorithm = 1;

    oneof parameters { AuthDhParameters auth_dh = 2; }
}

message GenerateKeyPairResponse
{
    uint32 private_key_id = 1;
    uint32 public_key_id = 2;
}

message DeriveSessionKeysRequest
{
    KeyPairAlgorithm algorithm = 1;
    uint32 private_key_id = 2;
    uint32 public_key_id = 3;
    uint32 derivation_key_id = 4;
}

message DeriveSessionKeysResponse
{
    uint32 encryption_key_id = 1;
    uint32 hmac_key_id = 2;
    uint32 wrapping_key_id = 3;
}

message GetKeyInfoRequest { uint32 key_id = 1; }

message GetKeyInfoResponse
{
    KeyType key_type = 1;
    repeated KeyUsage key_usage = 2;
    KeyAlgorithm key_algorithm = 3;
}

message GenerateKeyRequest
{
    GenerateKeyAlgorithm algorithm = 1;
    repeated KeyUsage key_usage = 2;
}

message GenerateKeyResponse { uint32 key_id = 1; }

message UnloadKeyRequest { uint32 key_id = 1; }

message UnloadKeyResponse { }

message ImportKeyRequest
{
    KeyType key_type = 1;
    optional ImportExportType import_export_type = 2;
    bytes key_blob = 3;
}

message ImportKeyResponse { uint32 key_id = 1; }

message ExportKeyRequest
{
    uint32 key_id = 1;
    optional ImportExportType import_export_type = 2;
}

message ExportKeyResponse { bytes key_blob = 1; }

message GenerateRandomRequest { uint32 number_of_bytes = 1; }

message GenerateRandomResponse { bytes random_value = 1; }

message EncryptRequest
{
    string buffer_id = 1;
    CipherAlgorithm algorithm = 2;
    uint32 key_id = 3;
    BufferRegion init_data = 4;
    BufferRegion input_data = 5;
}

message EncryptResponse { BufferRegion encrypted_data = 1; }

message DecryptRequest
{
    string buffer_id = 1;
    CipherAlgorithm algorithm = 2;
    uint32 key_id = 3;
    BufferRegion init_data = 4;
    BufferRegion encrypted_data = 5;
}

message DecryptResponse { BufferRegion output_data = 1; }
