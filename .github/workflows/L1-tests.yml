name: L1 tests and client build
on:
  push:
    branches: [main, develop, 'topic/**', 'release/**', 'sprint/**']
  pull_request:
    branches: [main, develop, 'topic/**', 'release/**', 'sprint/**']

permissions:
  contents: read

jobs:
  l1:
    uses: ./.github/workflows/native-ci.yml
    with:
      label: L1
      coverage: true
  client-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config protobuf-compiler libprotobuf-dev libzmq3-dev
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.3'
      - name: Build and verify client without Thunder
        run: |
          cmake -S . -B build-client -G Ninja -DPLUGIN_EYILGATEWAY=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build-client --parallel 4
          bash scripts/check-install.sh build-client rootfs/client
