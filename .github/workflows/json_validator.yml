name: JSON and repository validation
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: python3 -m pip install --target _deps/python -r scripts/requirements-dev.txt
      - name: Check JSON, formatting and licensing headers
        run: bash scripts/check-format.sh
