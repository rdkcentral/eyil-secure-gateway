name: Native build and tests
on:
  workflow_call:
    inputs:
      label:
        type: string
        default: 'L1|L2'
      coverage:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Host development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ git pkg-config python3-pip \
            protobuf-compiler libprotobuf-dev libzmq3-dev libssl-dev
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.3'
      - uses: actions/cache@v4
        with:
          path: _deps/thunder
          key: eyil-thunder-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('scripts/build-thunder.sh') }}
      - name: Build Thunder SDK
        run: bash build_dependencies.sh
      - name: Build plugin, client and protocol
        run: bash build.sh -DENABLE_COVERAGE=${{ inputs.coverage && 'ON' || 'OFF' }}
      - name: Run selected test suites
        if: ${{ !inputs.coverage }}
        env:
          TEST_LABEL: ${{ inputs.label }}
        run: |
          source scripts/environment.sh
          python3 scripts/run-tests.py --build-dir build --label "$TEST_LABEL"
      - name: Run coverage
        if: inputs.coverage
        env:
          TEST_LABEL: ${{ inputs.label }}
        run: |
          python3 -m pip install --target _deps/python gcovr==8.5
          source scripts/environment.sh
          python3 scripts/coverage.py --build-dir build --label "$TEST_LABEL"
      - name: Verify installed artifacts
        run: bash scripts/check-install.sh build rootfs/all
      - name: Publish summaries
        if: always()
        run: |
          for summary in build/reports/*/summary.md build/coverage/summary.md; do
            if [[ -f "$summary" ]]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-results-${{ inputs.label == 'L1|L2' && 'all' || inputs.label }}
          if-no-files-found: warn
          path: |
            build/reports/
            build/coverage/
            build/Testing/Temporary/*.log
