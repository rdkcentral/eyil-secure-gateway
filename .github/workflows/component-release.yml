name: Component release
on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: Existing CMake and changelog version to release from main
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate version field
        env:
          PR_DESC: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os
          import re

          body = os.environ.get("PR_DESC", "")
          assert re.search(r"(?im)^version:\s*(major|minor|patch)\s*$", body), \
              "Include version: major|minor|patch in the PR description"
          PY
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/check-version.py --version "$RELEASE_VERSION"
      - name: Create draft release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" \
            --draft --generate-notes --title "$RELEASE_VERSION"
